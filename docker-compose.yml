services:
  fredy:
    container_name: fredy
    image: ghcr.io/orangecoding/fredy:26.2.0
    environment:
      - NODE_ENV=production
    volumes:
      - ./conf:/conf
      - ./db:/db
    ports:
      - '127.0.0.1:9998:9998'
    restart: unless-stopped
    # Resource limits to prevent runaway memory usage from Chromium
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--show-error', '--max-time', '5', 'http://localhost:9998/']
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s
